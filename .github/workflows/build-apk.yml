name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android Keystore and Environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify Java version
        run: java -version

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Run build diagnostics
        run: ./gradlew tasks --stacktrace --warning-mode all

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --stacktrace --warning-mode all

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info --warning-mode all

      - name: Locate and inspect APK artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "=== APK Successfully Generated ==="
          echo "Path: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "Size in bytes: $(wc -c < "$APK_PATH")"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyCleaner-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
