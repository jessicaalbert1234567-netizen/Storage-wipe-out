name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android Keystore and Environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace --warning-mode all

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --info --warning-mode all

      - name: Prepare Release APK Artifact
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="v1.0.0"
          fi
          APK_SOURCE=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Built APK not found"
            exit 1
          fi
          DEST_APK="GalaxyCleaner-${TAG_NAME}.apk"
          cp "$APK_SOURCE" "$DEST_APK"
          echo "=== Release APK Ready ==="
          echo "Source: $APK_SOURCE"
          echo "Target: $DEST_APK"
          ls -lh "$DEST_APK"
          echo "Size in bytes: $(wc -c < "$DEST_APK")"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: GalaxyCleaner-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
